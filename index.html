<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pundo Ledger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --paper: #f3efe4;
    --paper-edge: #e8e2d2;
    --line-blue: #b9c6e0;
    --margin-red: #d98a8a;
    --ink: #2a3a63;
    --ink-soft: #4a5a83;
    --pencil: #6b6558;
    --minus: #b0402f;
    --plus: #2f6b4a;
    --shadow: rgba(40,30,10,0.18);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: #d8cdb6;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.25), transparent 40%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 2px, transparent 2px, transparent 6px);
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink);
    padding: 16px 8px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  h1.brand{
    font-family:'Caveat', cursive;
    font-size: 2.6rem;
    color:#3a2d20;
    margin: 0 0 4px;
    letter-spacing: 1px;
    text-align: center;
  }
  .brand-sub{
    font-size: 0.72rem;
    letter-spacing: 3px;
    color:#8a7d63;
    text-transform: uppercase;
    margin-bottom: 22px;
    text-align: center;
  }

  .page{
    position:relative;
    width:100%;
    max-width: 620px;
    background: var(--paper);
    border-radius: 3px;
    box-shadow: 0 18px 40px var(--shadow), 0 2px 0 var(--paper-edge);
    padding: 34px 20px 30px 48px;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 38px,
      var(--line-blue) 39px,
      var(--line-blue) 40px
    );
    background-position: 0 92px;
    overflow: hidden;
  }
  .page::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left: 36px;
    width:2px;
    background: var(--margin-red);
    opacity: 0.55;
  }
  .page::after{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height: 10px;
    background: repeating-radial-gradient(circle at 20px 5px, #cbbfa2 0 4px, transparent 5px 40px);
  }

  .name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    line-height: 32px;
  }
  .name-label {
    font-family: 'Caveat', cursive;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .name-select {
    font-family: 'Caveat', cursive;
    font-size: 1.35rem;
    font-weight: 700;
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--ink-soft);
    color: var(--ink);
    flex: 1;
    padding: 0 4px;
    cursor: pointer;
    border-radius: 0;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
  }
  .name-select:focus {
    outline: none;
    border-bottom-style: solid;
  }
  .name-select option {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.9rem;
    background: var(--paper);
    color: var(--ink);
  }

  .row{
    position:relative;
    display:flex;
    align-items:center;
    gap: 6px;
    min-height: 40px;
    line-height: 40px;
  }

  .item-row {
    cursor: grab;
    transition: background-color 0.2s, opacity 0.2s;
  }
  .item-row.dragging {
    opacity: 0.4;
    background-color: rgba(185, 198, 224, 0.2);
  }
  .drag-handle {
    cursor: grab;
    color: var(--pencil);
    font-size: 0.9rem;
    user-select: none;
    padding: 0 2px;
    opacity: 0.6;
    flex-shrink: 0;
  }
  .drag-handle:hover {
    opacity: 1;
  }

  .amt-field{
    font-family:'JetBrains Mono', monospace;
    font-size: 1.05rem;
    font-weight: 600;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    width: 95px;
    text-align: right;
    color: var(--ink);
    padding: 2px 2px;
    flex-shrink: 0;
  }
  .amt-field:focus{
    outline:none;
    border-bottom: 1px dashed var(--ink-soft);
  }
  .dash{
    color: var(--pencil);
    font-weight: 700;
    padding: 0 1px;
    flex-shrink: 0;
  }
  .label-field{
    font-family:'Caveat', cursive;
    font-size: 1.25rem;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    flex: 1;
    min-width: 0;
    color: var(--ink);
    padding: 2px 4px;
  }
  .label-field:focus{
    outline:none;
    border-bottom: 1px dashed var(--ink-soft);
  }
  .label-field::placeholder, .amt-field::placeholder{
    color:#b8ae94;
  }

  .start-row .amt-field{ font-size: 1.15rem; }
  .start-row .tag{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:1.25rem;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .date-field{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.85rem;
    border:none;
    background: transparent;
    color: var(--ink-soft);
    border-bottom: 1px dashed var(--ink-soft);
    width: 125px;
    flex-shrink: 0;
    cursor: pointer;
  }
  .date-field:focus{ outline:none; border-bottom: 1px solid var(--ink-soft); }

  .sign-toggle{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 1rem;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--pencil);
    background: transparent;
    cursor:pointer;
    color: var(--pencil);
    flex-shrink:0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .sign-toggle.plus{ color: var(--plus); border-color: var(--plus); }
  .sign-toggle.minus{ color: var(--minus); border-color: var(--minus); }

  .remove-btn{
    background:none;
    border:none;
    color:#c2a8a8;
    font-size: 1.1rem;
    cursor:pointer;
    width: 20px;
    flex-shrink:0;
    opacity: 0.5;
    transition: opacity .15s;
    padding: 0;
  }
  .remove-btn:hover{ opacity: 1; color: var(--minus); }

  .add-row-btn{
    margin: 6px 0 4px 0;
    background:none;
    border: none;
    font-family:'Caveat', cursive;
    font-size: 1.15rem;
    color: var(--ink-soft);
    cursor:pointer;
    text-decoration: underline dashed;
    text-underline-offset: 4px;
    padding: 4px 0;
  }
  .add-row-btn:hover{ color: var(--ink); }

  .total-underline{
    border: none;
    border-top: 2px solid var(--ink);
    margin: 6px 0 2px 0;
  }

  .total-row .amt-field{
    font-size: 1.2rem;
    font-weight: 700;
  }
  .total-row .amt-field.negative{
    color: var(--minus);
  }
  .total-row .tag{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size: 1.4rem;
    color:#3a2d20;
    flex-shrink: 0;
  }
  .total-row .tag.tapada{
    color: var(--minus);
  }

  .section-gap{ height: 10px; }

  .actions{
    display:flex;
    gap: 8px;
    margin-top: 22px;
    flex-wrap: wrap;
  }
  button.main-btn{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.5px;
    text-transform: uppercase;
    padding: 8px 12px;
    border-radius: 3px;
    border: 1px solid #3a2d20;
    background: #3a2d20;
    color: #f3efe4;
    cursor: pointer;
    transition: transform .1s, opacity .15s;
    flex: 1 1 auto;
    text-align: center;
  }
  button.main-btn.secondary{
    background: transparent;
    color: #3a2d20;
  }
  button.main-btn.export-btn{
    background: #2f6b4a;
    border-color: #2f6b4a;
    color: #ffffff;
  }
  button.main-btn:hover{ opacity: 0.85; }
  button.main-btn:active{ transform: scale(0.97); }

  .status{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.72rem;
    color: #8a7d63;
    margin-top: 10px;
    min-height: 14px;
  }

  @media (max-width: 480px){
    body { padding: 12px 4px 30px; }
    .page{ padding: 24px 10px 20px 32px; }
    .page::before{ left: 24px; }
    .amt-field{ width: 72px; font-size: 0.88rem; }
    .label-field{ font-size: 1.05rem; }
    .date-field{ width: 105px; font-size: 0.72rem; }
    .start-row .amt-field{ font-size: 0.95rem; }
    .total-row .amt-field{ font-size: 1rem; }
    .sign-toggle{ width: 20px; height: 20px; font-size: 0.85rem; }
    button.main-btn{ font-size: 0.68rem; padding: 8px 6px; }
  }
</style>
</head>
<body>

  <h1 class="brand">Pundo Ledger</h1>
  <div class="brand-sub">daily fund &amp; expense tracker</div>

  <div class="page" id="page">

    <div class="name-row">
      <span class="name-label">NAME:</span>
      <select class="name-select" id="userNameSelect">
        <option value="Juan Dela Cruz">Juan Dela Cruz</option>
        <option value="Pedro Penduko">Pedro Penduko</option>
        <option value="Maria Clara">Maria Clara</option>
        <option value="ADD_NEW">+ Add New Name...</option>
      </select>
    </div>

    <div class="row start-row">
      <input type="text" class="amt-field" id="startAmount" inputmode="decimal" placeholder="0" value="77,608">
      <span class="dash">-</span>
      <span class="tag">PUNDO</span>
      <input type="date" class="date-field" id="startDate">
    </div>

    <div class="section-gap"></div>

    <div id="rows"></div>

    <button class="add-row-btn" id="addRowBtn">+ add line</button>

    <hr class="total-underline">

    <div class="row total-row">
      <span class="amt-field" id="totalAmount" style="border:none;">0</span>
      <span class="dash">-</span>
      <span class="tag" id="totalTag">PUNDO</span>
      <input type="date" class="date-field" id="endDate">
    </div>

    <div class="actions" data-html2canvas-ignore="true">
      <button class="main-btn export-btn" id="exportBtn">📷 Save as Image</button>
      <button class="main-btn" id="saveBtn">Save to Google Sheet</button>
      <button class="main-btn secondary" id="newDayBtn">Start new day →</button>
      <button class="main-btn secondary" id="resetBtn">Clear numbers</button>
    </div>
    <div class="status" id="status" data-html2canvas-ignore="true"></div>
  </div>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzstlBLp4trLfrhSnDMYYqG6WW-V0Qp4WUfco_owEtJQdYvkbrJBBA7OO4tdJXGz0ZRgw/exec';

const rowsEl = document.getElementById('rows');
const startAmountEl = document.getElementById('startAmount');
const startDateEl = document.getElementById('startDate');
const endDateEl = document.getElementById('endDate');
const totalAmountEl = document.getElementById('totalAmount');
const totalTagEl = document.getElementById('totalTag');
const statusEl = document.getElementById('status');
const userNameSelectEl = document.getElementById('userNameSelect');

let rowIdCounter = 0;

const defaultTemplate = [
  ['+', '25,440', 'TOTAL BET'],
  ['-', '2,400', 'TOTAL HITS'],
  ['-', '1,400', "RUNNER'S SAL."],
  ['-', '3,400', "TELLER'S SAL."],
  ['-', '1,500', 'RENT CODE 12'],
  ['-', '40,000', 'TULAK SA ADMIN'],
  ['-', '23', '1 CORRECTIONAL TAPE']
];

function formatDateString(d) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function setDefaultDates() {
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);
  
  startDateEl.value = formatDateString(yesterday);
  endDateEl.value = formatDateString(today);
}

function loadSavedNames() {
  const savedNames = JSON.parse(localStorage.getItem('pundo_custom_names') || '[]');
  savedNames.forEach(name => {
    const opt = document.createElement('option');
    opt.value = name;
    opt.textContent = name;
    userNameSelectEl.insertBefore(opt, userNameSelectEl.lastElementChild);
  });
}

function saveCustomName(name) {
  const savedNames = JSON.parse(localStorage.getItem('pundo_custom_names') || '[]');
  if (!savedNames.includes(name)) {
    savedNames.push(name);
    localStorage.setItem('pundo_custom_names', JSON.stringify(savedNames));
  }
}

userNameSelectEl.addEventListener('change', (e) => {
  if (e.target.value === 'ADD_NEW') {
    const newName = prompt('Enter new name:');
    if (newName && newName.trim() !== '') {
      const cleanName = newName.trim();
      saveCustomName(cleanName);
      
      const opt = document.createElement('option');
      opt.value = cleanName;
      opt.textContent = cleanName;
      
      userNameSelectEl.insertBefore(opt, userNameSelectEl.lastElementChild);
      userNameSelectEl.value = cleanName;
    } else {
      userNameSelectEl.selectedIndex = 0;
    }
  }
});

function parseNum(str){
  if(!str) return 0;
  const n = parseFloat(String(str).replace(/,/g,'').trim());
  return isNaN(n) ? 0 : n;
}

function formatNum(n){
  const sign = n < 0 ? '-' : '';
  n = Math.abs(n);
  const parts = n.toFixed(n % 1 === 0 ? 0 : 2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return sign + parts.join('.');
}

function makeRow(sign, amount, label){
  const id = 'r' + (rowIdCounter++);
  const wrap = document.createElement('div');
  wrap.className = 'row item-row';
  wrap.dataset.id = id;
  wrap.draggable = true;
  wrap.innerHTML = `
    <span class="drag-handle" data-html2canvas-ignore="true">⋮⋮</span>
    <button class="sign-toggle ${sign === '+' ? 'plus' : 'minus'}" data-role="sign">${sign}</button>
    <input type="text" class="amt-field" data-role="amount" inputmode="decimal" placeholder="0" value="${amount}">
    <span class="dash">-</span>
    <input type="text" class="label-field" data-role="label" placeholder="what's this for?" value="${label}">
    <button class="remove-btn" data-role="remove" title="remove" data-html2canvas-ignore="true">✕</button>
  `;
  rowsEl.appendChild(wrap);
  wireRow(wrap);
}

function wireRow(wrap){
  const signBtn = wrap.querySelector('[data-role="sign"]');
  const amtInput = wrap.querySelector('[data-role="amount"]');
  const removeBtn = wrap.querySelector('[data-role="remove"]');

  signBtn.addEventListener('click', () => {
    const isPlus = signBtn.classList.contains('plus');
    signBtn.classList.toggle('plus', !isPlus);
    signBtn.classList.toggle('minus', isPlus);
    signBtn.textContent = isPlus ? '-' : '+';
    recalc();
  });
  amtInput.addEventListener('input', recalc);
  removeBtn.addEventListener('click', () => {
    wrap.remove();
    recalc();
  });

  wrap.addEventListener('dragstart', () => {
    wrap.classList.add('dragging');
  });

  wrap.addEventListener('dragend', () => {
    wrap.classList.remove('dragging');
    recalc();
  });
}

rowsEl.addEventListener('dragover', (e) => {
  e.preventDefault();
  const draggingItem = document.querySelector('.dragging');
  const siblings = [...rowsEl.querySelectorAll('.item-row:not(.dragging)')];

  const nextSibling = siblings.find(sibling => {
    const box = sibling.getBoundingClientRect();
    return e.clientY <= box.top + box.height / 2;
  });

  if (nextSibling) {
    rowsEl.insertBefore(draggingItem, nextSibling);
  } else {
    rowsEl.appendChild(draggingItem);
  }
});

function recalc(){
  const start = parseNum(startAmountEl.value);
  let total = start;
  rowsEl.querySelectorAll('.item-row').forEach(wrap => {
    const sign = wrap.querySelector('[data-role="sign"]').textContent.trim();
    const amt = parseNum(wrap.querySelector('[data-role="amount"]').value);
    total += (sign === '+' ? amt : -amt);
  });
  
  totalAmountEl.textContent = formatNum(total);

  if (total < 0) {
    totalTagEl.textContent = 'TAPADA';
    totalTagEl.classList.add('tapada');
    totalAmountEl.classList.add('negative');
  } else {
    totalTagEl.textContent = 'PUNDO';
    totalTagEl.classList.remove('tapada');
    totalAmountEl.classList.remove('negative');
  }

  return total;
}

startAmountEl.addEventListener('input', recalc);

document.getElementById('addRowBtn').addEventListener('click', () => {
  makeRow('-', '', '');
  recalc();
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if(!confirm('Clear all numbers?')) return;
  
  startAmountEl.value = '';
  rowsEl.querySelectorAll('.item-row').forEach(wrap => {
    wrap.querySelector('[data-role="amount"]').value = '';
  });
  
  recalc();
  setStatus('Numbers cleared.');
});

document.getElementById('newDayBtn').addEventListener('click', () => {
  const total = recalc();
  const newStart = formatNum(total);
  const newDate = endDateEl.value;
  
  startAmountEl.value = newStart;
  startDateEl.value = newDate;
  
  rowsEl.querySelectorAll('.item-row').forEach(wrap => {
    wrap.querySelector('[data-role="amount"]').value = '';
  });

  recalc();
  setStatus('New day started — balance carried over as ' + newStart + '.');
});

document.getElementById('exportBtn').addEventListener('click', () => {
  setStatus('Generating image...');
  const page = document.getElementById('page');
  
  html2canvas(page, {
    scale: 2,
    useCORS: true,
    backgroundColor: '#f3efe4'
  }).then(canvas => {
    const image = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    const filename = (userNameSelectEl.value.trim() || 'pundo_ledger') + '_' + (endDateEl.value || 'ledger') + '.png';
    link.href = image;
    link.download = filename;
    link.click();
    setStatus('Image downloaded!');
  }).catch(err => {
    console.error(err);
    setStatus('Failed to export image.');
  });
});

function setStatus(msg){
  statusEl.textContent = msg;
  setTimeout(() => { if(statusEl.textContent === msg) statusEl.textContent = ''; }, 4000);
}

async function saveToGoogleSheet() {
  setStatus('Saving to Google Sheet...');
  const total = recalc();

  const lineItems = [];
  rowsEl.querySelectorAll('.item-row').forEach(wrap => {
    const sign = wrap.querySelector('[data-role="sign"]').textContent.trim();
    const amt = wrap.querySelector('[data-role="amount"]').value.trim();
    const label = wrap.querySelector('[data-role="label"]').value.trim();
    if (amt || label) {
      lineItems.push(`${sign}${amt} (${label})`);
    }
  });

  const payload = {
    userName: userNameSelectEl.value,
    startAmount: startAmountEl.value,
    startDate: startDateEl.value,
    endDate: endDateEl.value,
    total: formatNum(total),
    details: lineItems.join(', ')
  };

  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });

    setStatus('Saved to Google Sheet!');
  } catch (err) {
    console.error(err);
    setStatus('Failed to save to Google Sheet.');
  }
}

document.getElementById('saveBtn').addEventListener('click', saveToGoogleSheet);

setDefaultDates();
loadSavedNames();
defaultTemplate.forEach(([sign, amt, label]) => makeRow(sign, amt, label));
recalc();
</script>
</body>
</html>
