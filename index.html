<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Pundo Ledger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --paper: #f3efe4;
    --paper-edge: #e8e2d2;
    --line-blue: #b9c6e0;
    --margin-red: #d98a8a;
    --ink: #2a3a63;
    --ink-soft: #4a5a83;
    --pencil: #6b6558;
    --minus: #b0402f;
    --plus: #2f6b4a;
    --shadow: rgba(40,30,10,0.18);
  }

  *{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }

  body{
    margin:0;
    min-height:100vh;
    background: #d8cdb6;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.25), transparent 40%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 2px, transparent 2px, transparent 6px);
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink);
    padding: 10px 8px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  h1.brand{
    font-family:'Caveat', cursive;
    font-size: 2.2rem;
    color:#3a2d20;
    margin: 0 0 2px;
    letter-spacing: 1px;
    text-align: center;
  }
  .brand-sub{
    font-size: 0.65rem;
    letter-spacing: 2px;
    color:#8a7d63;
    text-transform: uppercase;
    margin-bottom: 14px;
    text-align: center;
  }

  .app-container {
    display: flex;
    flex-direction: column;
    gap: 14px;
    width: 100%;
    max-width: 620px;
  }

  .page{
    position:relative;
    width: 100%;
    background: var(--paper);
    border-radius: 3px;
    box-shadow: 0 12px 30px var(--shadow), 0 2px 0 var(--paper-edge);
    padding: 24px 12px 20px 32px;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 38px,
      var(--line-blue) 39px,
      var(--line-blue) 40px
    );
    background-position: 0 82px;
    overflow: hidden;
  }
  .page::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left: 24px;
    width:2px;
    background: var(--margin-red);
    opacity: 0.55;
  }
  .page::after{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height: 10px;
    background: repeating-radial-gradient(circle at 20px 5px, #cbbfa2 0 4px, transparent 5px 40px);
  }

  .bottom-panel {
    width: 100%;
    background: var(--paper);
    border-radius: 3px;
    box-shadow: 0 8px 20px var(--shadow), 0 2px 0 var(--paper-edge);
    padding: 14px;
  }

  .bottom-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 4px;
  }

  .bottom-title {
    font-family: 'Caveat', cursive;
    font-size: 1.7rem;
    color: #3a2d20;
    margin: 0;
  }

  .filter-group {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .filter-label {
    font-size: 0.7rem;
    color: var(--pencil);
  }

  .filter-date-input {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    border: 1px dashed var(--ink-soft);
    background: transparent;
    color: var(--ink);
    padding: 2px 4px;
    border-radius: 3px;
  }

  .clear-filter-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.65rem;
    background: transparent;
    border: 1px solid var(--ink-soft);
    color: var(--ink-soft);
    border-radius: 3px;
    cursor: pointer;
    padding: 2px 5px;
  }

  .bottom-sub {
    font-size: 0.75rem;
    color: var(--pencil);
    font-style: italic;
    margin-bottom: 10px;
  }

  .history-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 240px;
    overflow-y: auto;
  }

  .history-item {
    border-bottom: 1px dashed var(--ink-soft);
    padding: 6px 2px;
    cursor: pointer;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.8rem;
  }

  .history-date {
    font-family: 'JetBrains Mono', monospace;
    font-weight: bold;
    color: var(--ink-soft);
    font-size: 0.8rem;
  }

  .name-row {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 6px;
    line-height: 32px;
  }
  .name-label {
    font-family: 'Caveat', cursive;
    font-size: 1.2rem;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .name-select {
    font-family: 'Caveat', cursive;
    font-size: 1.25rem;
    font-weight: 700;
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--ink-soft);
    color: var(--ink);
    flex: 1;
    padding: 0 4px;
    cursor: pointer;
    border-radius: 0;
    -webkit-appearance: none;
    appearance: none;
  }

  .row{
    position:relative;
    display:flex;
    align-items:center;
    gap: 4px;
    min-height: 40px;
    line-height: 40px;
  }

  .item-row { touch-action: manipulation; }

  .amt-field{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.95rem;
    font-weight: 600;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    width: 78px;
    text-align: right;
    color: var(--ink);
    padding: 2px 0;
    flex-shrink: 0;
  }
  .amt-field:focus{ outline:none; border-bottom: 1px dashed var(--ink-soft); background: rgba(255,255,255,0.4); }
  .dash{ color: var(--pencil); font-weight: 700; padding: 0 1px; flex-shrink: 0; }
  
  .label-field{
    font-family:'Caveat', cursive;
    font-size: 1.15rem;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    flex: 1;
    min-width: 0;
    color: var(--ink);
    padding: 2px 2px;
  }
  .label-field:focus{ outline:none; border-bottom: 1px dashed var(--ink-soft); background: rgba(255,255,255,0.4); }

  .start-row .amt-field{ font-size: 1.05rem; width: 85px; }
  .start-row .tag{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:1.15rem;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .date-field{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.75rem;
    border:none;
    background: transparent;
    color: var(--ink-soft);
    border-bottom: 1px dashed var(--ink-soft);
    width: 110px;
    flex-shrink: 0;
    cursor: pointer;
    padding: 0;
  }

  .pundo-actions-group {
    display: flex;
    gap: 3px;
    flex-shrink: 0;
  }
  .load-pundo-btn, .clear-nums-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.58rem;
    background: transparent;
    border: 1px dashed var(--ink-soft);
    color: var(--ink-soft);
    border-radius: 3px;
    cursor: pointer;
    padding: 3px 4px;
    line-height: 1.1;
    flex-shrink: 0;
  }
  .clear-nums-btn { border-color: var(--minus); color: var(--minus); }

  .sign-toggle{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 0.9rem;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--pencil);
    background: transparent;
    cursor:pointer;
    color: var(--pencil);
    flex-shrink:0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .sign-toggle.plus{ color: var(--plus); border-color: var(--plus); }
  .sign-toggle.minus{ color: var(--minus); border-color: var(--minus); }

  .remove-btn{
    background:none; border:none; color:#c2a8a8; font-size: 1rem;
    cursor:pointer; width: 22px; flex-shrink:0; padding: 0; text-align: center;
  }

  .add-row-btn{
    margin: 8px 0 4px 0; background:none; border: none;
    font-family:'Caveat', cursive; font-size: 1.1rem; color: var(--ink-soft);
    cursor:pointer; text-decoration: underline dashed; text-underline-offset: 3px; padding: 4px 0;
  }

  .total-underline{ border: none; border-top: 2px solid var(--ink); margin: 6px 0 2px 0; }
  .total-row .amt-field{ font-size: 1.1rem; font-weight: 700; width: 100px; text-align: left; }
  .total-row .amt-field.negative{ color: var(--minus); }
  .total-row .tag{ font-family:'Caveat', cursive; font-weight:700; font-size: 1.3rem; color:#3a2d20; flex-shrink: 0; }
  .total-row .tag.tapada{ color: var(--minus); }

  .section-gap{ height: 6px; }

  .actions{ display:grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 16px; }
  button.main-btn{
    font-family:'JetBrains Mono', monospace; font-size: 0.7rem; letter-spacing: 0.3px;
    text-transform: uppercase; padding: 10px 6px; border-radius: 3px; border: 1px solid #3a2d20;
    background: #3a2d20; color: #f3efe4; cursor: pointer; text-align: center;
  }
  button.main-btn.secondary{ background: transparent; color: #3a2d20; }
  button.main-btn.export-btn{ background: #2f6b4a; border-color: #2f6b4a; color: #ffffff; grid-column: span 2; }

  .status{ font-family:'JetBrains Mono', monospace; font-size: 0.7rem; color: #8a7d63; margin-top: 8px; min-height: 14px; text-align: center; }

  /* Modal Styling */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(42, 58, 99, 0.5);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 16px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease;
  }
  .modal-overlay.active {
    opacity: 1;
    pointer-events: auto;
  }
  .modal-card {
    background: var(--paper);
    width: 100%;
    max-width: 320px;
    padding: 20px;
    border-radius: 4px;
    box-shadow: 0 10px 25px var(--shadow), 0 2px 0 var(--paper-edge);
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .modal-title {
    font-family: 'Caveat', cursive;
    font-size: 1.6rem;
    color: #3a2d20;
    margin: 0;
  }
  .modal-input {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.95rem;
    border: 1px dashed var(--ink-soft);
    background: rgba(255,255,255,0.6);
    color: var(--ink);
    padding: 8px;
    border-radius: 3px;
    width: 100%;
  }
  .modal-input:focus {
    outline: none;
    border-color: var(--ink);
    background: #ffffff;
  }
  .modal-buttons {
    display: flex;
    gap: 8px;
    justify-content: flex-end;
    margin-top: 4px;
  }
  .modal-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    padding: 6px 12px;
    border-radius: 3px;
    cursor: pointer;
    border: 1px solid #3a2d20;
  }
  .modal-btn.cancel {
    background: transparent;
    color: #3a2d20;
  }
  .modal-btn.confirm {
    background: #3a2d20;
    color: #f3efe4;
  }
</style>
</head>
<body>

  <h1 class="brand">Pundo Ledger</h1>
  <div class="brand-sub">daily fund &amp; expense tracker</div>

  <div class="app-container">
    <div class="page" id="page">

      <div class="name-row">
        <span class="name-label">NAME:</span>
        <select class="name-select" id="userNameSelect">
          <option value="Juan Dela Cruz">Juan Dela Cruz</option>
          <option value="Pedro Penduko">Pedro Penduko</option>
          <option value="Maria Clara">Maria Clara</option>
          <option value="jomz">jomz</option>
          <option value="corella">corella</option>
          <option value="Paul">Paul</option>
          <option value="nono">nono</option>
          <option value="ADD_NEW">+ Add New Name...</option>
        </select>
      </div>

      <div class="row start-row">
        <input type="text" class="amt-field" id="startAmount" inputmode="decimal" placeholder="0" value="77,608">
        <div class="pundo-actions-group" data-html2canvas-ignore="true">
          <button class="load-pundo-btn" id="savePrevPundoBtn" title="Save sheet locally">💾 Save</button>
          <button class="clear-nums-btn" id="clearNumsBtn" title="Clear all number amounts">🧹 Clear #</button>
        </div>
        <span class="dash">-</span>
        <span class="tag">PUNDO</span>
        <input type="date" class="date-field" id="startDate">
      </div>

      <div class="section-gap"></div>

      <div id="rows"></div>

      <button class="add-row-btn" id="addRowBtn">+ add line</button>

      <hr class="total-underline">

      <div class="row total-row">
        <span class="amt-field" id="totalAmount" style="border:none;">0</span>
        <span class="dash">-</span>
        <span class="tag" id="totalTag">PUNDO</span>
        <input type="date" class="date-field" id="endDate">
      </div>

      <div class="actions" data-html2canvas-ignore="true">
        <button class="main-btn export-btn" id="exportBtn">📷 Save Image</button>
        <button class="main-btn" id="saveBtn">Save Sheet</button>
        <button class="main-btn secondary" id="newDayBtn">New Day</button>
        <button class="main-btn secondary" id="resetBtn" style="grid-column: span 2;">Clear Sheet</button>
      </div>
      <div class="status" id="status" data-html2canvas-ignore="true"></div>
    </div>

    <!-- Bottom Section for Previous Days with Date Filter -->
    <div class="bottom-panel" data-html2canvas-ignore="true">
      <div class="bottom-header">
        <h2 class="bottom-title">Previous days</h2>
        <div class="filter-group">
          <span class="filter-label">Date:</span>
          <input type="date" class="filter-date-input" id="historyDateFilter">
          <button class="clear-filter-btn" id="clearFilterBtn">All</button>
        </div>
      </div>
      <div class="bottom-sub" id="historySubText">nothing saved yet</div>
      <div class="history-list" id="historyList"></div>
    </div>
  </div>

  <!-- Custom Add Name Modal -->
  <div class="modal-overlay" id="nameModal" data-html2canvas-ignore="true">
    <div class="modal-card">
      <h3 class="modal-title">Add New Name</h3>
      <input type="text" class="modal-input" id="newUserNameInput" placeholder="Enter full name..." autocomplete="off">
      <div class="modal-buttons">
        <button class="modal-btn cancel" id="modalCancelBtn">Cancel</button>
        <button class="modal-btn confirm" id="modalConfirmBtn">Add Name</button>
      </div>
    </div>
  </div>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzstlBLp4trLfrhSnDMYYqG6WW-V0Qp4WUfco_owEtJQdYvkbrJBBA7OO4tdJXGz0ZRgw/exec';

const rowsEl = document.getElementById('rows');
const startAmountEl = document.getElementById('startAmount');
const startDateEl = document.getElementById('startDate');
const endDateEl = document.getElementById('endDate');
const totalAmountEl = document.getElementById('totalAmount');
const totalTagEl = document.getElementById('totalTag');
const statusEl = document.getElementById('status');
const userNameSelectEl = document.getElementById('userNameSelect');
const historyListEl = document.getElementById('historyList');
const historySubTextEl = document.getElementById('historySubText');
const historyDateFilterEl = document.getElementById('historyDateFilter');
const clearFilterBtnEl = document.getElementById('clearFilterBtn');

// Modal Elements
const nameModalEl = document.getElementById('nameModal');
const newUserNameInputEl = document.getElementById('newUserNameInput');
const modalCancelBtnEl = document.getElementById('modalCancelBtn');
const modalConfirmBtnEl = document.getElementById('modalConfirmBtn');

let rowIdCounter = 0;
let previousSelectedName = userNameSelectEl.value;

const defaultTemplate = [
  ['+', '4,440', 'TOTAL BET'],
  ['-', '600', 'TOTAL HITS'],
  ['-', '500', "RUNNER'S SAL."],
  ['-', '3,400', "TELLER'S SAL."],
  ['-', '1,500', 'RENT CODE 12'],
  ['-', '40,000', 'TULAK SA ADMIN'],
  ['-', '23', '1 CORRECTIONAL TAPE']
];

function formatDateString(d) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function setDefaultDates() {
  const today = new Date();
  startDateEl.value = formatDateString(today);
  endDateEl.value = formatDateString(today);
}

function parseNum(str){
  if(!str) return 0;
  const n = parseFloat(String(str).replace(/,/g,'').trim());
  return isNaN(n) ? 0 : n;
}

function formatNum(n){
  const sign = n < 0 ? '-' : '';
  n = Math.abs(n);
  const parts = n.toFixed(n % 1 === 0 ? 0 : 2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return sign + parts.join('.');
}

function makeRow(sign, amount, label){
  const id = 'r' + (rowIdCounter++);
  const wrap = document.createElement('div');
  wrap.className = 'row item-row';
  wrap.dataset.id = id;
  wrap.innerHTML = `
    <button class="sign-toggle ${sign === '+' ? 'plus' : 'minus'}" data-role="sign">${sign}</button>
    <input type="text" class="amt-field" data-role="amount" inputmode="decimal" placeholder="0" value="${amount}">
    <span class="dash">-</span>
    <input type="text" class="label-field" data-role="label" placeholder="what's this for?" value="${label}">
    <button class="remove-btn" data-role="remove" title="remove" data-html2canvas-ignore="true">✕</button>
  `;
  rowsEl.appendChild(wrap);
  wireRow(wrap);
}

function wireRow(wrap){
  const signBtn = wrap.querySelector('[data-role="sign"]');
  const amtInput = wrap.querySelector('[data-role="amount"]');
  const labelInput = wrap.querySelector('[data-role="label"]');
  const removeBtn = wrap.querySelector('[data-role="remove"]');

  signBtn.addEventListener('click', () => {
    const isPlus = signBtn.classList.contains('plus');
    signBtn.classList.toggle('plus', !isPlus);
    signBtn.classList.toggle('minus', isPlus);
    signBtn.textContent = isPlus ? '-' : '+';
    recalc();
    saveToLocalStorage();
  });

  amtInput.addEventListener('input', () => { recalc(); saveToLocalStorage(); });
  labelInput.addEventListener('input', saveToLocalStorage);
  removeBtn.addEventListener('click', () => { wrap.remove(); recalc(); saveToLocalStorage(); });
}

function recalc(){
  const start = parseNum(startAmountEl.value);
  let total = start;
  rowsEl.querySelectorAll('.item-row').forEach(wrap => {
    const sign = wrap.querySelector('[data-role="sign"]').textContent.trim();
    const amt = parseNum(wrap.querySelector('[data-role="amount"]').value);
    total += (sign === '+' ? amt : -amt);
  });
  
  totalAmountEl.textContent = formatNum(total);

  if (total < 0) {
    totalTagEl.textContent = 'TAPADA';
    totalTagEl.classList.add('tapada');
    totalAmountEl.classList.add('negative');
  } else {
    totalTagEl.textContent = 'PUNDO';
    totalTagEl.classList.remove('tapada');
    totalAmountEl.classList.remove('negative');
  }

  return total;
}

function ensureNameInSelect(name) {
  if (!name) return;
  let exists = false;
  for (let i = 0; i < userNameSelectEl.options.length; i++) {
    if (userNameSelectEl.options[i].value === name) {
      exists = true;
      break;
    }
  }
  if (!exists) {
    const newOpt = document.createElement('option');
    newOpt.value = name;
    newOpt.textContent = name;
    userNameSelectEl.insertBefore(newOpt, userNameSelectEl.lastElementChild);
  }
  userNameSelectEl.value = name;
  previousSelectedName = name;
}

userNameSelectEl.addEventListener('change', () => {
  if (userNameSelectEl.value === 'ADD_NEW') {
    openNameModal();
  } else {
    previousSelectedName = userNameSelectEl.value;
    saveToLocalStorage();
  }
});

function openNameModal() {
  newUserNameInputEl.value = '';
  nameModalEl.classList.add('active');
  setTimeout(() => newUserNameInputEl.focus(), 50);
}

function closeNameModal() {
  nameModalEl.classList.remove('active');
  userNameSelectEl.value = previousSelectedName;
}

modalCancelBtnEl.addEventListener('click', closeNameModal);

modalConfirmBtnEl.addEventListener('click', () => {
  const newName = newUserNameInputEl.value.trim();
  if (newName !== '') {
    ensureNameInSelect(newName);
    nameModalEl.classList.remove('active');
    saveToLocalStorage();
  } else {
    alert('Please enter a valid name.');
  }
});

newUserNameInputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    modalConfirmBtnEl.click();
  } else if (e.key === 'Escape') {
    closeNameModal();
  }
});

function saveToLocalStorage() {
  const lineItems = [];
  rowsEl.querySelectorAll('.item-row').forEach(wrap => {
    lineItems.push({
      sign: wrap.querySelector('[data-role="sign"]').textContent.trim(),
      amount: wrap.querySelector('[data-role="amount"]').value,
      label: wrap.querySelector('[data-role="label"]').value
    });
  });

  const state = {
    userName: userNameSelectEl.value,
    startAmount: startAmountEl.value,
    startDate: startDateEl.value,
    endDate: endDateEl.value,
    lineItems: lineItems
  };

  localStorage.setItem('pundo_ledger_draft', JSON.stringify(state));
}

function loadFromLocalStorage() {
  const savedData = localStorage.getItem('pundo_ledger_draft');
  if (!savedData) return false;

  try {
    const state = JSON.parse(savedData);
    if (state.userName) ensureNameInSelect(state.userName);
    if (state.startAmount !== undefined) startAmountEl.value = state.startAmount;
    if (state.startDate) startDateEl.value = state.startDate;
    if (state.endDate) endDateEl.value = state.endDate;

    rowsEl.innerHTML = '';
    if (state.lineItems && state.lineItems.length > 0) {
      state.lineItems.forEach(item => makeRow(item.sign, item.amount, item.label));
    } else {
      defaultTemplate.forEach(([sign, amt, label]) => makeRow(sign, amt, label));
    }
    recalc();
    return true;
  } catch (e) {
    console.error('Failed to load local draft:', e);
    return false;
  }
}

function getLocalPundoHistory() {
  const data = localStorage.getItem('pundo_history_records');
  return data ? JSON.parse(data) : [];
}

function renderLocalHistory() {
  let records = getLocalPundoHistory();
  
  if (!records || records.length === 0) {
    historySubTextEl.textContent = 'nothing saved yet';
    historyListEl.innerHTML = '';
    return;
  }

  const selectedDate = historyDateFilterEl.value;
  if (selectedDate) {
    records = records.filter(r => {
      const recordDate = r.endDate || r.date;
      return recordDate === selectedDate;
    });
  }

  if (records.length === 0) {
    historySubTextEl.textContent = `no records found for ${selectedDate}`;
    historyListEl.innerHTML = '';
    return;
  }

  historySubTextEl.textContent = selectedDate 
    ? `records for ${selectedDate}:` 
    : 'saved local records:';
  
  historyListEl.innerHTML = '';
  records.slice().reverse().forEach((rec) => {
    const displayDate = rec.endDate || rec.startDate || rec.date;
    const displayTotal = rec.total || formatNum(parseNum(rec.pundo));
    const div = document.createElement('div');
    div.className = 'history-item';
    div.innerHTML = `
      <div><span class="history-date">${displayDate}</span> • <strong>${rec.userName}</strong></div>
      <div><strong>${displayTotal}</strong></div>
    `;
    div.addEventListener('click', () => {
      ensureNameInSelect(rec.userName);
      startAmountEl.value = rec.startAmount || rec.pundo;
      if (rec.startDate) startDateEl.value = rec.startDate;
      if (rec.endDate) endDateEl.value = rec.endDate;

      if (rec.lineItems && rec.lineItems.length > 0) {
        rowsEl.innerHTML = '';
        rec.lineItems.forEach(item => makeRow(item.sign, item.amount, item.label));
      }

      recalc();
      saveToLocalStorage();
      setStatus(`Loaded record for ${rec.userName} (${displayDate})`);
    });
    historyListEl.appendChild(div);
  });
}

historyDateFilterEl.addEventListener('change', renderLocalHistory);

clearFilterBtnEl.addEventListener('click', () => {
  historyDateFilterEl.value = '';
  renderLocalHistory();
});

function saveSheetLocally() {
  const name = userNameSelectEl.value;
  const endDate = endDateEl.value || formatDateString(new Date());
  const startDate = startDateEl.value || endDate;
  const pundoVal = startAmountEl.value.trim();
  const totalVal = formatNum(recalc());

  const lineItems = [];
  rowsEl.querySelectorAll('.item-row').forEach(wrap => {
    lineItems.push({
      sign: wrap.querySelector('[data-role="sign"]').textContent.trim(),
      amount: wrap.querySelector('[data-role="amount"]').value,
      label: wrap.querySelector('[data-role="label"]').value
    });
  });

  const records = getLocalPundoHistory();
  const existingIdx = records.findIndex(r => r.userName === name && (r.endDate === endDate || r.date === endDate));
  
  const newRecord = {
    userName: name,
    startDate: startDate,
    endDate: endDate,
    startAmount: pundoVal,
    pundo: totalVal,
    total: totalVal,
    lineItems: lineItems
  };

  if (existingIdx >= 0) {
    records[existingIdx] = newRecord;
  } else {
    records.push(newRecord);
  }

  localStorage.setItem('pundo_history_records', JSON.stringify(records));
  historyDateFilterEl.value = '';
  renderLocalHistory();
}

async function saveToBoth() {
  saveSheetLocally();
  setStatus('Saving...');
  const total = recalc();
  const formattedTotal = formatNum(total);

  const formattedLineItems = [];
  rowsEl.querySelectorAll('.item-row').forEach(wrap => {
    const sign = wrap.querySelector('[data-role="sign"]').textContent.trim();
    const amt = wrap.querySelector('[data-role="amount"]').value.trim();
    const label = wrap.querySelector('[data-role="label"]').value.trim();
    if (amt || label) formattedLineItems.push(`${sign}${amt} (${label})`);
  });

  const payload = {
    userName: userNameSelectEl.value,
    startAmount: startAmountEl.value,
    pundo: startAmountEl.value,
    startDate: startDateEl.value,
    endDate: endDateEl.value,
    total: formattedTotal,
    details: formattedLineItems.join(', ')
  };

  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });

    localStorage.setItem('pundo_ledger_last_ending', formattedTotal);
    setStatus('Saved successfully!');
  } catch (err) {
    console.error(err);
    setStatus('Saved locally (network error to cloud).');
  }
}

document.getElementById('savePrevPundoBtn').addEventListener('click', () => {
  saveSheetLocally();
  setStatus('Saved locally!');
});

document.getElementById('clearNumsBtn').addEventListener('click', () => {
  startAmountEl.value = '';
  rowsEl.querySelectorAll('.amt-field').forEach(input => {
    input.value = '';
  });
  recalc();
  saveToLocalStorage();
  setStatus('Cleared all number amounts.');
});

document.getElementById('saveBtn').addEventListener('click', saveToBoth);

document.getElementById('newDayBtn').addEventListener('click', () => {
  saveSheetLocally();
  const currentTotal = totalAmountEl.textContent;
  startAmountEl.value = currentTotal;
  setDefaultDates();
  rowsEl.innerHTML = '';
  defaultTemplate.forEach(([sign, amt, label]) => makeRow(sign, amt, label));
  recalc();
  saveToLocalStorage();
  setStatus('Started new day with carryover!');
});

document.getElementById('resetBtn').addEventListener('click', () => {
  if (confirm('Clear current sheet?')) {
    rowsEl.innerHTML = '';
    recalc();
    saveToLocalStorage();
    setStatus('Sheet cleared.');
  }
});

document.getElementById('exportBtn').addEventListener('click', () => {
  const pageNode = document.getElementById('page');
  html2canvas(pageNode, { scale: 2 }).then(canvas => {
    const link = document.createElement('a');
    link.download = `pundo_${userNameSelectEl.value}_${endDateEl.value}.png`;
    link.href = canvas.toDataURL();
    link.click();
  });
});

startAmountEl.addEventListener('input', () => { recalc(); saveToLocalStorage(); });
startDateEl.addEventListener('change', saveToLocalStorage);
endDateEl.addEventListener('change', saveToLocalStorage);

document.getElementById('addRowBtn').addEventListener('click', () => { 
  makeRow('-', '', ''); 
  recalc(); 
  saveToLocalStorage();
});

function setStatus(msg){
  statusEl.textContent = msg;
  setTimeout(() => { if(statusEl.textContent === msg) statusEl.textContent = ''; }, 3000);
}

const loaded = loadFromLocalStorage();
if (!loaded) {
  setDefaultDates();
  defaultTemplate.forEach(([sign, amt, label]) => makeRow(sign, amt, label));
  recalc();
}

renderLocalHistory();
</script>
</body>
</html>
