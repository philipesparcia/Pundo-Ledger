<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pundo Ledger</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap');

  :root{
    --paper: #f3efe4;
    --paper-edge: #e8e2d2;
    --line-blue: #b9c6e0;
    --margin-red: #d98a8a;
    --ink: #2a3a63;
    --ink-soft: #4a5a83;
    --pencil: #6b6558;
    --minus: #b0402f;
    --plus: #2f6b4a;
    --shadow: rgba(40,30,10,0.18);
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: #d8cdb6;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.25), transparent 40%),
      repeating-linear-gradient(45deg, rgba(0,0,0,0.015) 0px, rgba(0,0,0,0.015) 2px, transparent 2px, transparent 6px);
    font-family: 'JetBrains Mono', monospace;
    color: var(--ink);
    padding: 16px 8px 40px;
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  h1.brand{
    font-family:'Caveat', cursive;
    font-size: 2.6rem;
    color:#3a2d20;
    margin: 0 0 4px;
    letter-spacing: 1px;
    text-align: center;
  }
  .brand-sub{
    font-size: 0.72rem;
    letter-spacing: 3px;
    color:#8a7d63;
    text-transform: uppercase;
    margin-bottom: 22px;
    text-align: center;
  }

  .page{
    position:relative;
    width:100%;
    max-width: 620px;
    background: var(--paper);
    border-radius: 3px;
    box-shadow: 0 18px 40px var(--shadow), 0 2px 0 var(--paper-edge);
    padding: 34px 20px 30px 48px;
    background-image: repeating-linear-gradient(
      to bottom,
      transparent 0px,
      transparent 38px,
      var(--line-blue) 39px,
      var(--line-blue) 40px
    );
    background-position: 0 92px;
    overflow: hidden;
  }
  .page::before{
    content:"";
    position:absolute;
    top:0; bottom:0; left: 36px;
    width:2px;
    background: var(--margin-red);
    opacity: 0.55;
  }
  .page::after{
    content:"";
    position:absolute;
    top:0; left:0; right:0; height: 10px;
    background: repeating-radial-gradient(circle at 20px 5px, #cbbfa2 0 4px, transparent 5px 40px);
  }

  .editing-banner {
    display: none;
    background: #fff3cd;
    color: #856404;
    padding: 6px 12px;
    font-size: 0.8rem;
    border-radius: 3px;
    margin-bottom: 12px;
    text-align: center;
    border: 1px dashed #ffeba2;
  }

  .name-row {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 8px;
    line-height: 32px;
  }
  .name-label {
    font-family: 'Caveat', cursive;
    font-size: 1.3rem;
    font-weight: 700;
    color: var(--ink-soft);
  }
  .name-select {
    font-family: 'Caveat', cursive;
    font-size: 1.35rem;
    font-weight: 700;
    background: transparent;
    border: none;
    border-bottom: 1px dashed var(--ink-soft);
    color: var(--ink);
    flex: 1;
    padding: 0 4px;
    cursor: pointer;
    border-radius: 0;
    -webkit-appearance: none;
    -moz-appearance: none;
    appearance: none;
  }

  .row{
    position:relative;
    display:flex;
    align-items:center;
    gap: 6px;
    min-height: 40px;
    line-height: 40px;
  }

  .item-row { cursor: grab; }
  .item-row.dragging { opacity: 0.4; }
  .drag-handle {
    cursor: grab;
    color: var(--pencil);
    font-size: 0.9rem;
    user-select: none;
    padding: 0 2px;
    opacity: 0.6;
    flex-shrink: 0;
  }

  .amt-field{
    font-family:'JetBrains Mono', monospace;
    font-size: 1.05rem;
    font-weight: 600;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    width: 95px;
    text-align: right;
    color: var(--ink);
    padding: 2px 2px;
    flex-shrink: 0;
  }
  .amt-field:focus{ outline:none; border-bottom: 1px dashed var(--ink-soft); }
  .dash{ color: var(--pencil); font-weight: 700; padding: 0 1px; flex-shrink: 0; }
  .label-field{
    font-family:'Caveat', cursive;
    font-size: 1.25rem;
    background: transparent;
    border: none;
    border-bottom: 1px dashed transparent;
    flex: 1;
    min-width: 0;
    color: var(--ink);
    padding: 2px 4px;
  }
  .label-field:focus{ outline:none; border-bottom: 1px dashed var(--ink-soft); }

  .start-row .amt-field{ font-size: 1.15rem; }
  .start-row .tag{
    font-family:'Caveat', cursive;
    font-weight:700;
    font-size:1.25rem;
    color: var(--ink-soft);
    flex-shrink: 0;
  }
  .date-field{
    font-family:'JetBrains Mono', monospace;
    font-size: 0.85rem;
    border:none;
    background: transparent;
    color: var(--ink-soft);
    border-bottom: 1px dashed var(--ink-soft);
    width: 125px;
    flex-shrink: 0;
    cursor: pointer;
  }

  .sign-toggle{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 1rem;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    border: 1.5px solid var(--pencil);
    background: transparent;
    cursor:pointer;
    color: var(--pencil);
    flex-shrink:0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0;
  }
  .sign-toggle.plus{ color: var(--plus); border-color: var(--plus); }
  .sign-toggle.minus{ color: var(--minus); border-color: var(--minus); }

  .remove-btn{
    background:none; border:none; color:#c2a8a8; font-size: 1.1rem;
    cursor:pointer; width: 20px; flex-shrink:0; opacity: 0.5; padding: 0;
  }
  .remove-btn:hover{ opacity: 1; color: var(--minus); }

  .add-row-btn{
    margin: 6px 0 4px 0; background:none; border: none;
    font-family:'Caveat', cursive; font-size: 1.15rem; color: var(--ink-soft);
    cursor:pointer; text-decoration: underline dashed; text-underline-offset: 4px; padding: 4px 0;
  }

  .total-underline{ border: none; border-top: 2px solid var(--ink); margin: 6px 0 2px 0; }
  .total-row .amt-field{ font-size: 1.2rem; font-weight: 700; }
  .total-row .amt-field.negative{ color: var(--minus); }
  .total-row .tag{ font-family:'Caveat', cursive; font-weight:700; font-size: 1.4rem; color:#3a2d20; flex-shrink: 0; }
  .total-row .tag.tapada{ color: var(--minus); }

  .section-gap{ height: 10px; }

  .actions{ display:flex; gap: 8px; margin-top: 22px; flex-wrap: wrap; }
  button.main-btn{
    font-family:'JetBrains Mono', monospace; font-size: 0.75rem; letter-spacing: 0.5px;
    text-transform: uppercase; padding: 8px 12px; border-radius: 3px; border: 1px solid #3a2d20;
    background: #3a2d20; color: #f3efe4; cursor: pointer; transition: transform .1s, opacity .15s;
    flex: 1 1 auto; text-align: center;
  }
  button.main-btn.secondary{ background: transparent; color: #3a2d20; }
  button.main-btn.export-btn{ background: #2f6b4a; border-color: #2f6b4a; color: #ffffff; }

  .status{ font-family:'JetBrains Mono', monospace; font-size: 0.72rem; color: #8a7d63; margin-top: 10px; min-height: 14px; }

  .modal-overlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.5); z-index: 1000; align-items: center; justify-content: center;
  }
  .modal-content {
    background: var(--paper); padding: 20px; border-radius: 5px; width: 90%; max-width: 480px;
    max-height: 80vh; overflow-y: auto; box-shadow: 0 10px 25px rgba(0,0,0,0.3);
  }
  .history-item {
    border-bottom: 1px dashed var(--ink-soft); padding: 10px 0; cursor: pointer; display: flex;
    justify-content: space-between; align-items: center;
  }
  .history-item:hover { background: rgba(0,0,0,0.03); }

  @media (max-width: 480px){
    body { padding: 12px 4px 30px; }
    .page{ padding: 24px 10px 20px 32px; }
    .page::before{ left: 24px; }
    .amt-field{ width: 72px; font-size: 0.88rem; }
    .label-field{ font-size: 1.05rem; }
    .date-field{ width: 105px; font-size: 0.72rem; }
    button.main-btn{ font-size: 0.68rem; padding: 8px 6px; }
  }
</style>
</head>
<body>

  <h1 class="brand">Pundo Ledger</h1>
  <div class="brand-sub">daily fund &amp; expense tracker</div>

  <div class="page" id="page">

    <div class="editing-banner" id="editingBanner">
      ✏️ Modifying Row <span id="editingRowIndex"></span> from Google Sheets. <a href="#" id="cancelEditBtn" style="color:#856404; font-weight:bold;">Cancel Edit</a>
    </div>

    <div class="name-row">
      <span class="name-label">NAME:</span>
      <select class="name-select" id="userNameSelect">
        <option value="Juan Dela Cruz">Juan Dela Cruz</option>
        <option value="Pedro Penduko">Pedro Penduko</option>
        <option value="Maria Clara">Maria Clara</option>
        <option value="ADD_NEW">+ Add New Name...</option>
      </select>
    </div>

    <div class="row start-row">
      <input type="text" class="amt-field" id="startAmount" inputmode="decimal" placeholder="0" value="77,608">
      <span class="dash">-</span>
      <span class="tag">PUNDO</span>
      <input type="date" class="date-field" id="startDate">
    </div>

    <div class="section-gap"></div>

    <div id="rows"></div>

    <button class="add-row-btn" id="addRowBtn">+ add line</button>

    <hr class="total-underline">

    <div class="row total-row">
      <span class="amt-field" id="totalAmount" style="border:none;">0</span>
      <span class="dash">-</span>
      <span class="tag" id="totalTag">PUNDO</span>
      <input type="date" class="date-field" id="endDate">
    </div>

    <div class="actions" data-html2canvas-ignore="true">
      <button class="main-btn export-btn" id="exportBtn">📷 Save Image</button>
      <button class="main-btn" id="saveBtn">Save Sheet</button>
      <button class="main-btn secondary" id="historyBtn">📜 Edit History</button>
      <button class="main-btn secondary" id="newDayBtn">Start New Day</button>
      <button class="main-btn secondary" id="resetBtn">Clear</button>
    </div>
    <div class="status" id="status" data-html2canvas-ignore="true"></div>
  </div>

  <div class="modal-overlay" id="historyModal">
    <div class="modal-content">
      <h3 style="margin-top:0;">Past Transactions</h3>
      <div id="historyList">Loading history...</div>
      <button class="main-btn secondary" id="closeModalBtn" style="margin-top:15px; width:100%;">Close</button>
    </div>
  </div>

<script>
const GOOGLE_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzstlBLp4trLfrhSnDMYYqG6WW-V0Qp4WUfco_owEtJQdYvkbrJBBA7OO4tdJXGz0ZRgw/exec';

const rowsEl = document.getElementById('rows');
const startAmountEl = document.getElementById('startAmount');
const startDateEl = document.getElementById('startDate');
const endDateEl = document.getElementById('endDate');
const totalAmountEl = document.getElementById('totalAmount');
const totalTagEl = document.getElementById('totalTag');
const statusEl = document.getElementById('status');
const userNameSelectEl = document.getElementById('userNameSelect');

let rowIdCounter = 0;
let currentEditingRowIndex = null;

const defaultTemplate = [
  ['+', '25,440', 'TOTAL BET'],
  ['-', '2,400', 'TOTAL HITS'],
  ['-', '1,400', "RUNNER'S SAL."],
  ['-', '3,400', "TELLER'S SAL."],
  ['-', '1,500', 'RENT CODE 12'],
  ['-', '40,000', 'TULAK SA ADMIN'],
  ['-', '23', '1 CORRECTIONAL TAPE']
];

function formatDateString(d) {
  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${year}-${month}-${day}`;
}

function setDefaultDates() {
  const today = new Date();
  const yesterday = new Date(today);
  yesterday.setDate(today.getDate() - 1);
  startDateEl.value = formatDateString(yesterday);
  endDateEl.value = formatDateString(today);
}

function parseNum(str){
  if(!str) return 0;
  const n = parseFloat(String(str).replace(/,/g,'').trim());
  return isNaN(n) ? 0 : n;
}

function formatNum(n){
  const sign = n < 0 ? '-' : '';
  n = Math.abs(n);
  const parts = n.toFixed(n % 1 === 0 ? 0 : 2).split('.');
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',');
  return sign + parts.join('.');
}

function makeRow(sign, amount, label){
  const id = 'r' + (rowIdCounter++);
  const wrap = document.createElement('div');
  wrap.className = 'row item-row';
  wrap.dataset.id = id;
  wrap.draggable = true;
  wrap.innerHTML = `
    <span class="drag-handle" data-html2canvas-ignore="true">⋮⋮</span>
    <button class="sign-toggle ${sign === '+' ? 'plus' : 'minus'}" data-role="sign">${sign}</button>
    <input type="text" class="amt-field" data-role="amount" inputmode="decimal" placeholder="0" value="${amount}">
    <span class="dash">-</span>
    <input type="text" class="label-field" data-role="label" placeholder="what's this for?" value="${label}">
    <button class="remove-btn" data-role="remove" title="remove" data-html2canvas-ignore="true">✕</button>
  `;
  rowsEl.appendChild(wrap);
  wireRow(wrap);
}

function wireRow(wrap){
  const signBtn = wrap.querySelector('[data-role="sign"]');
  const amtInput = wrap.querySelector('[data-role="amount"]');
  const labelInput = wrap.querySelector('[data-role="label"]');
  const removeBtn = wrap.querySelector('[data-role="remove"]');

  signBtn.addEventListener('click', () => {
    const isPlus = signBtn.classList.contains('plus');
    signBtn.classList.toggle('plus', !isPlus);
    signBtn.classList.toggle('minus', isPlus);
    signBtn.textContent = isPlus ? '-' : '+';
    recalc();
    saveToLocalStorage();
  });

  amtInput.addEventListener('input', () => { recalc(); saveToLocalStorage(); });
  labelInput.addEventListener('input', saveToLocalStorage);
  removeBtn.addEventListener('click', () => { wrap.remove(); recalc(); saveToLocalStorage(); });
}

function recalc(){
  const start = parseNum(startAmountEl.value);
  let total = start;
  rowsEl.querySelectorAll('.item-row').forEach(wrap => {
    const sign = wrap.querySelector('[data-role="sign"]').textContent.trim();
    const amt = parseNum(wrap.querySelector('[data-role="amount"]').value);
    total += (sign === '+' ? amt : -amt);
  });
  
  totalAmountEl.textContent = formatNum(total);

  if (total < 0) {
    totalTagEl.textContent = 'TAPADA';
    totalTagEl.classList.add('tapada');
    totalAmountEl.classList.add('negative');
  } else {
    totalTagEl.textContent = 'PUNDO';
    totalTagEl.classList.remove('tapada');
    totalAmountEl.classList.remove('negative');
  }

  return total;
}

function saveToLocalStorage() {
  const lineItems = [];
  rowsEl.querySelectorAll('.item-row').forEach(wrap => {
    lineItems.push({
      sign: wrap.querySelector('[data-role="sign"]').textContent.trim(),
      amount: wrap.querySelector('[data-role="amount"]').value,
      label: wrap.querySelector('[data-role="label"]').value
    });
  });

  const state = {
    userName: userNameSelectEl.value,
    startAmount: startAmountEl.value,
    startDate: startDateEl.value,
    endDate: endDateEl.value,
    lineItems: lineItems
  };

  localStorage.setItem('pundo_ledger_draft', JSON.stringify(state));
}

function loadFromLocalStorage() {
  const savedData = localStorage.getItem('pundo_ledger_draft');
  if (!savedData) return false;

  try {
    const state = JSON.parse(savedData);
    if (state.userName) userNameSelectEl.value = state.userName;
    if (state.startAmount !== undefined) startAmountEl.value = state.startAmount;
    if (state.startDate) startDateEl.value = state.startDate;
    if (state.endDate) endDateEl.value = state.endDate;

    rowsEl.innerHTML = '';
    if (state.lineItems && state.lineItems.length > 0) {
      state.lineItems.forEach(item => makeRow(item.sign, item.amount, item.label));
    } else {
      defaultTemplate.forEach(([sign, amt, label]) => makeRow(sign, amt, label));
    }
    recalc();
    return true;
  } catch (e) {
    console.error('Failed to load local draft:', e);
    return false;
  }
}

startAmountEl.addEventListener('input', () => { recalc(); saveToLocalStorage(); });
startDateEl.addEventListener('change', saveToLocalStorage);
endDateEl.addEventListener('change', saveToLocalStorage);
userNameSelectEl.addEventListener('change', saveToLocalStorage);

async function saveToGoogleSheet() {
  setStatus('Saving to Google Sheet...');
  const total = recalc();

  const lineItems = [];
  rowsEl.querySelectorAll('.item-row').forEach(wrap => {
    const sign = wrap.querySelector('[data-role="sign"]').textContent.trim();
    const amt = wrap.querySelector('[data-role="amount"]').value.trim();
    const label = wrap.querySelector('[data-role="label"]').value.trim();
    if (amt || label) lineItems.push(`${sign}${amt} (${label})`);
  });

  const payload = {
    rowIndex: currentEditingRowIndex,
    userName: userNameSelectEl.value,
    startAmount: startAmountEl.value,
    startDate: startDateEl.value,
    endDate: endDateEl.value,
    total: formatNum(total),
    details: lineItems.join(', ')
  };

  try {
    await fetch(GOOGLE_SCRIPT_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify(payload)
    });

    setStatus(currentEditingRowIndex ? 'Entry updated in Google Sheet!' : 'Saved to Google Sheet!');
    cancelEditMode();
  } catch (err) {
    console.error(err);
    setStatus('Failed to save to Google Sheet.');
  }
}

document.getElementById('historyBtn').addEventListener('click', async () => {
  document.getElementById('historyModal').style.display = 'flex';
  const listEl = document.getElementById('historyList');
  listEl.innerHTML = 'Loading history...';

  try {
    const res = await fetch(GOOGLE_SCRIPT_URL);
    const data = await res.json();
    
    if(!data.length) {
      listEl.innerHTML = 'No history records found.';
      return;
    }

    listEl.innerHTML = '';
    data.reverse().forEach(item => {
      const div = document.createElement('div');
      div.className = 'history-item';
      div.innerHTML = `
        <div>
          <strong>${item.userName}</strong> (${item.endDate})<br>
          <small style="color:var(--pencil);">${item.details}</small>
        </div>
        <div style="text-align:right;">
          <strong>${item.total}</strong>
        </div>
      `;
      div.addEventListener('click', () => loadTransactionForEdit(item));
      listEl.appendChild(div);
    });
  } catch (e) {
    listEl.innerHTML = 'Failed to load history.';
  }
});

function loadTransactionForEdit(item) {
  currentEditingRowIndex = item.rowIndex;
  userNameSelectEl.value = item.userName;
  startAmountEl.value = item.startAmount;
  startDateEl.value = item.startDate ? item.startDate.split('T')[0] : '';
  endDateEl.value = item.endDate ? item.endDate.split('T')[0] : '';

  rowsEl.innerHTML = '';
  if (item.details) {
    const items = item.details.replace(/^'/, '').split(', ');
    items.forEach(raw => {
      const match = raw.match(/^([+-])([\d,.]+)\s*\((.*)\)$/);
      if (match) makeRow(match[1], match[2], match[3]);
    });
  }

  recalc();
  saveToLocalStorage();
  document.getElementById('editingRowIndex').textContent = item.rowIndex;
  document.getElementById('editingBanner').style.display = 'block';
  document.getElementById('historyModal').style.display = 'none';
}

function cancelEditMode() {
  currentEditingRowIndex = null;
  document.getElementById('editingBanner').style.display = 'none';
}

document.getElementById('cancelEditBtn').addEventListener('click', (e) => {
  e.preventDefault();
  cancelEditMode();
  rowsEl.innerHTML = '';
  defaultTemplate.forEach(([sign, amt, label]) => makeRow(sign, amt, label));
  recalc();
  saveToLocalStorage();
});

document.getElementById('closeModalBtn').addEventListener('click', () => {
  document.getElementById('historyModal').style.display = 'none';
});

document.getElementById('addRowBtn').addEventListener('click', () => { 
  makeRow('-', '', ''); 
  recalc(); 
  saveToLocalStorage();
});

document.getElementById('saveBtn').addEventListener('click', saveToGoogleSheet);

function setStatus(msg){
  statusEl.textContent = msg;
  setTimeout(() => { if(statusEl.textContent === msg) statusEl.textContent = ''; }, 4000);
}

const loaded = loadFromLocalStorage();
if (!loaded) {
  setDefaultDates();
  defaultTemplate.forEach(([sign, amt, label]) => makeRow(sign, amt, label));
  recalc();
}
</script>
</body>
</html>
